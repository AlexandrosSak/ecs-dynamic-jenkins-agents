jenkins:
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "USER:Overall/Administer:admin"
  log:
    recorders:
      - loggers:
          - level: "CONFIG"
            name: "jenkins.plugins.slack"
        name: "plugin_slack"
  mode: EXCLUSIVE
  numExecutors: 1
  labelString: "controller"
  clouds:
    - eC2Fleet:
        addNodeOnlyIfRunning: false
        alwaysReconnect: false
        cloudStatusIntervalSec: 10
        computerConnector:
          sSHConnector:
            credentialsId: "jenkins-agent-ssh-key"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            port: 22
            retryWaitTime: 15
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        disableTaskResubmit: false
        fleet: "jenkins_agents"
        idleMinutes: 0
        initOnlineCheckIntervalSec: 15
        initOnlineTimeoutSec: 180
        labelString: "ec2-fleet"
        maxSize: 6
        maxTotalUses: -1
        minSize: 0
        minSpareSize: 0
        name: "Dev-Fleet"
        noDelayProvision: false
        numExecutors: 1
        privateIpUsed: true
        region: "eu-west-1"
        restrictUsage: false
        scaleExecutorsByWeight: false

security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy:
      manuallyProvidedKeyVerificationStrategy:
        approvedHostKeys: |-
          bitbucket.org ssh-rsa 

unclassified:
  location:
    url: "https://jenkins-controller.company.net:8080"
  slackNotifier:
    botUser: false
    sendAsText: false
    teamDomain: "company"
    tokenCredentialId: "slack-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: bitbucket_infrastructure_ssh_key
              username: git
              description: "Bitbucket SSH Key for Infrastructure Repositories"
              privateKeySource:
                directEntry:
                  privateKey: "$${readFile:/var/lib/jenkins/secrets/bitbucket_infrastructure}"
          - string:
              scope: GLOBAL
              id: "slack-token"
              secret: "$${readFile:/var/lib/jenkins/secrets/slack}"
              description: "Slack Notification Webhook Token"